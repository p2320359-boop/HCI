<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Echo Canvas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#F8F6F1;--text:#252423;--muted:#9A9189;--accent:#AA6672;--surface:rgba(255,255,255,.65);--border:rgba(37,36,35,.07)}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--text);touch-action:none}
  #app{display:flex;flex-direction:column;height:100dvh;width:100%;max-width:480px;margin:0 auto;position:relative}
  header{padding:env(safe-area-inset-top,12px) 20px 6px;display:flex;align-items:center;justify-content:space-between;z-index:10}
  .logo{font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px}
  .logo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pd 3s ease-in-out infinite}
  @keyframes pd{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:1}}
  .header-actions{display:none}
  .btn-i{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px)}
  .btn-i:active{transform:scale(.9)}.btn-i svg{width:15px;height:15px;color:var(--muted)}
  .canvas-wrap{flex:1;position:relative;margin:6px 12px;border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px var(--border)}
  #c{width:100%;height:100%;display:block;border-radius:22px;cursor:crosshair}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.03;border-radius:22px;mix-blend-mode:multiply;pointer-events:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1s;border-radius:22px}
  .overlay.hidden{opacity:0}
  .overlay-t{font-size:20px;font-weight:300;opacity:.4;letter-spacing:.5px}
  .overlay-s{font-size:11px;color:var(--muted);font-weight:300;opacity:.4;margin-top:6px}
  .controls{padding:10px 20px 6px;display:flex;align-items:center;justify-content:center;gap:18px;z-index:10}
  .mic-btn{width:62px;height:62px;border-radius:50%;border:none;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 24px rgba(44,40,37,.15)}
  .mic-btn:active{transform:scale(.88)}
  .mic-btn.on{background:var(--accent);box-shadow:0 4px 32px rgba(170,102,114,.2)}
  .mic-btn.on::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1.5px solid var(--accent);opacity:0;animation:mr 3s ease-out infinite}
  @keyframes mr{0%{transform:scale(.92);opacity:.35}100%{transform:scale(1.5);opacity:0}}
  .mic-btn svg{width:22px;height:22px}
  .side-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .side-btn:active{transform:scale(.88)}.side-btn svg{width:17px;height:17px;color:var(--muted)}
  .footer{padding:4px 20px env(safe-area-inset-bottom,18px);text-align:center}
  .privacy{font-size:10px;color:var(--muted);opacity:.35;font-weight:300}
  .toast{position:fixed;bottom:116px;left:50%;transform:translateX(-50%) translateY(16px);padding:9px 18px;border-radius:12px;background:var(--text);color:#fff;font-size:12px;font-weight:300;opacity:0;transition:all .3s;z-index:100;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .stats{position:absolute;top:8px;left:8px;z-index:15;font-size:9px;font-weight:400;color:var(--muted);line-height:1.7;background:rgba(248,246,241,.92);padding:7px 10px;border-radius:8px;pointer-events:none;backdrop-filter:blur(6px);font-family:'DM Sans',monospace;letter-spacing:.3px;min-width:160px}
  .stats span{display:inline-block;min-width:36px;text-align:right}
  .stats .l{color:var(--muted);opacity:.55;display:inline-block;min-width:26px;text-align:left}
  .stats .vy{color:var(--accent);font-weight:500}
  .back-home{position:fixed;top:14px;left:14px;z-index:100;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#6C4F88;background:rgba(255,255,255,.78);box-shadow:0 14px 30px rgba(108,79,136,.13);text-decoration:none;backdrop-filter:blur(10px)}
  .back-home svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<a class="back-home" href="../index.html" aria-label="Back to tools"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></a>
<div id="app">
  <header>
    <div class="logo"><span class="logo-dot"></span>Echo Canvas</div>
  </header>
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <canvas id="g" class="grain"></canvas>
    <div class="stats" id="stats"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-t">Tap Canvas to Start</div>
      <div class="overlay-s">Speak to paint your mood</div>
    </div>
  </div>
  <div class="controls">
    <button class="side-btn" id="btnSaveLg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
    <button class="mic-btn" id="btnMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
    <button class="side-btn" id="btnResetLg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg></button>
  </div>
  <div class="footer"><div class="privacy">Your voice stays on this device.</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var C=$('c'), X=C.getContext('2d');
var GC=$('g'), GX=GC.getContext('2d');

// ── Monet offscreen accumulation canvas ──────────────────
var MC=document.createElement('canvas'), MX=MC.getContext('2d');
var KC=document.createElement('canvas'), KX=KC.getContext('2d');

var W,H,dpr;
function resize(){
  var r=C.parentElement.getBoundingClientRect();
  var oldM=null,oldK=null;
  if(MC.width&&MC.height){
    oldM=document.createElement('canvas');oldM.width=MC.width;oldM.height=MC.height;
    oldM.getContext('2d').drawImage(MC,0,0);
    oldK=document.createElement('canvas');oldK.width=KC.width;oldK.height=KC.height;
    oldK.getContext('2d').drawImage(KC,0,0);
  }
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0);
  GC.width=W*dpr;GC.height=H*dpr;GX.setTransform(dpr,0,0,dpr,0,0);
  MC.width=W*dpr;MC.height=H*dpr;MX.setTransform(dpr,0,0,dpr,0,0);
  KC.width=W*dpr;KC.height=H*dpr;KX.setTransform(dpr,0,0,dpr,0,0);
  MX.fillStyle='#F8F6F1';MX.fillRect(0,0,W,H);
  KX.clearRect(0,0,W,H);
  if(oldM)MX.drawImage(oldM,0,0,W,H);
  if(oldK)KX.drawImage(oldK,0,0,W,H);
  makeGrain();
}
function makeGrain(){
  var id=GX.createImageData(W,H),d=id.data;
  for(var i=0;i<d.length;i+=4){var v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=25}
  GX.putImageData(id,0,0);
}
window.addEventListener('resize',resize);resize();

// ── Helpers ──────────────────────────────────────────────
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2500)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v}
function R(a,b){return a+Math.random()*(b-a)}
function gauss(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function pick(arr){return arr[Math.random()*arr.length|0]}
function col3(c,a){return'rgba('+c[0]+','+c[1]+','+c[2]+','+(a==null?1:clamp(a,0,1))+')'}

// ── AUDIO STATE ───────────────────────────────────────────
var AC,AN,MS,FD,TD;
var on=false,audioTimer=null,rafId=null,fc=0;
var calib=false,calN=0,calArr=[],calRmsArr=[],CAL_FRAMES=32,nFloor=0,nGate=0,rFloor=0,rGate=0;
var rawRms=0,specE=0,rCent=0.5,rFlux=0,rHz=0,rHarm=0.5;
var speaking=false,voiceNow=false,voiceFrames=0,quietFrames=0,prevSpec=null;
var sVol=0,sCent=0.5,sFlux=0,sHz=200,sHarm=0.5,sPres=0,sRate=0,lastVoiceScore=0;
var sylT=[],hasPainted=false,lastSpeakEnd=0,audioOK=false;
var currentEco='dreamPond';
var speechStart=0,kLastSpawnMs=0,kSpeechSpawns=0,kPhraseEnergy=0,kPhraseCent=0.5,kPhraseFlux=0,kPhraseHarm=0.5,kPhraseN=0,kPhraseId=0;
var emoVol=0,emoCent=0.5,emoFlux=0,emoHarm=0.5,emoRate=0,emotionLock='dreamPond';

// Onset detection
var fluxHist=[],onsetFired=false,onsetStr=0,onsetLastFC=-99;

function readAudio(){
  if(!AN||!audioOK)return;
  AN.getByteFrequencyData(FD);
  AN.getByteTimeDomainData(TD);
  var sr=AC.sampleRate,N=FD.length,bHz=sr/AN.fftSize;
  var vLo=Math.max(2,65/bHz|0),vHi=Math.min(N-1,8000/bHz|0);

  var rs=0;
  for(var i=0;i<TD.length;i++){var v=(TD[i]-128)/128;rs+=v*v}
  rawRms=Math.sqrt(rs/TD.length);

  var se=0;
  for(var i=vLo;i<=vHi;i++)se+=FD[i]*FD[i];
  specE=Math.sqrt(se/Math.max(vHi-vLo+1,1));

  var ws=0,wt=0;
  for(var i=vLo;i<=vHi;i++){var v2=FD[i];ws+=i*v2;wt+=v2}
  rCent=wt>15?clamp((ws/wt*bHz-65)/5000,0,1):0.5;

  var fs=0;
  if(prevSpec){for(var i=vLo;i<=vHi;i++){var d=FD[i]-prevSpec[i];fs+=d*d}}
  prevSpec=new Uint8Array(FD);
  rFlux=Math.sqrt(fs/Math.max(vHi-vLo+1,1));

  // Onset: flux spike > 2.2× rolling average, minimum gap 6 frames
  fluxHist.push(rFlux);
  if(fluxHist.length>12)fluxHist.shift();
  var avgFlux=fluxHist.reduce(function(a,b){return a+b},0)/fluxHist.length;
  var isOnset=speaking&&rFlux>Math.max(avgFlux*1.12,2.0)&&(fc-onsetLastFC)>2;
  if(isOnset)onsetLastFC=fc;
  onsetFired=isOnset;
  onsetStr=isOnset?clamp((rFlux-avgFlux)/Math.max(avgFlux,1)*0.32,0.12,1):0;

  var maxI=0,maxV=0;
  for(var i=vLo;i<N/2;i++){if(FD[i]>maxV){maxV=FD[i];maxI=i}}
  var pkHz=(maxI/N)*(sr/2);
  rHz=(pkHz>60&&pkHz<800)?pkHz:0;

  var pE=0,nE=0,pk=0;
  for(var i=vLo+2;i<vHi-2;i++){
    var v3=FD[i];
    if(v3>FD[i-1]&&v3>FD[i+1]&&v3>FD[i-2]&&v3>FD[i+2]&&v3>25){pE+=v3*v3;pk++}else nE+=v3*v3;
  }
  rHarm=pk>2&&nE>0?clamp(pE/(pE+nE*0.5),0,1):(pk>0?0.3:0.1);

  if(calib){
    calArr.push(specE);calRmsArr.push(rawRms);calN++;
    if(calN>=CAL_FRAMES){
      calArr.sort(function(a,b){return a-b});
      calRmsArr.sort(function(a,b){return a-b});
      nFloor=calArr[calArr.length*0.72|0]||1;
      rFloor=calRmsArr[calRmsArr.length*0.72|0]||0.002;
      nGate=Math.max(nFloor*1.12,0.55);
      rGate=Math.max(rFloor*1.45,0.004);
      calib=false;
      toast('Ready. Speak to paint.');
    }
    return;
  }

  var wasSp=speaking;
  var voiceScore=Math.max(
    (specE-nFloor)/Math.max(nGate-nFloor,0.45),
    (rawRms-rFloor)/Math.max(rGate-rFloor,0.0018),
    rFlux/8
  );
  lastVoiceScore=voiceScore;
  voiceNow=(
    (specE>nGate*0.92&&rawRms>rFloor*1.16)||
    (rawRms>rGate&&specE>nFloor*1.1)||
    (voiceScore>1.0&&rFlux>2.4&&rawRms>rFloor*1.1)
  );
  if(voiceNow){voiceFrames++;quietFrames=0;}
  else {quietFrames++;voiceFrames=0;}
  var voiceLike=voiceFrames>=2;
  var quietLike=quietFrames>=5&&(specE<nFloor*1.12||rawRms<rFloor*1.28);
  if(voiceLike)speaking=true;
  else if(quietLike)speaking=false;
  var nowVoice=performance.now();
  if(!wasSp&&speaking){
    speechStart=nowVoice;kLastSpawnMs=nowVoice-900;kSpeechSpawns=0;kPhraseEnergy=0;kPhraseCent=0.5;kPhraseFlux=0;kPhraseHarm=0.5;kPhraseN=0;
    $('overlay').classList.add('hidden');
  }
  if(wasSp&&!speaking)lastSpeakEnd=nowVoice;

  if(voiceNow&&rFlux>1.45){
    var now=performance.now();
    if(!sylT.length||now-sylT[sylT.length-1]>120)sylT.push(now);
  }
  var now2=performance.now();
  sylT=sylT.filter(function(t){return t>now2-3000});
  var tgRate=sylT.length>=3?(sylT.length-1)/Math.max((sylT[sylT.length-1]-sylT[0])/1000,0.1):0;
  sRate=lerp(sRate,tgRate,0.1);

  var sm=0.3,voiceN=voiceNow?clamp(voiceScore/1.35,0,1):0;
  sVol=lerp(sVol,voiceN,sm);
  sCent=lerp(sCent,voiceNow?rCent:sCent,sm);
  sFlux=lerp(sFlux,voiceNow?clamp(rFlux/40,0,1):0,sm*0.5);
  sHz=rHz>0?lerp(sHz,rHz,sm):sHz;
  sHarm=lerp(sHarm,voiceNow?rHarm:sHarm,sm);
  sPres=lerp(sPres,voiceNow?1:0,sm*0.3);

  if(voiceNow){
    kPhraseN++;
    kPhraseEnergy=lerp(kPhraseEnergy,voiceN,0.12);
    kPhraseCent=lerp(kPhraseCent,rCent,0.12);
    kPhraseFlux=lerp(kPhraseFlux,clamp(rFlux/40,0,1),0.12);
    kPhraseHarm=lerp(kPhraseHarm,rHarm,0.12);
  }

  if(voiceNow){
    emoVol=lerp(emoVol,sVol,0.08);
    emoCent=lerp(emoCent,sCent,0.08);
    emoFlux=lerp(emoFlux,sFlux,0.08);
    emoHarm=lerp(emoHarm,sHarm,0.08);
    emoRate=lerp(emoRate,clamp(sRate/5,0,1),0.08);
  }
  var nextEco=emotionLock;
  if(emoFlux>0.46||emoRate>0.52||emoCent>0.66)nextEco='auroraBloom';
  else if(emoVol>0.48||emoCent>0.52)nextEco='coralCurrent';
  else if(emoVol<0.34&&emoFlux<0.3)nextEco='dreamPond';
  if(nextEco!==emotionLock&&Math.abs(emoVol-sVol)+Math.abs(emoCent-sCent)+Math.abs(emoFlux-sFlux)>0.16)emotionLock=nextEco;
  currentEco=emotionLock;
}

// ══════════════════════════════════════════════════════════
// LAYER 1 — MONET (impressionist wash, accumulates on MC)
// ══════════════════════════════════════════════════════════
// Each eco maps to a set of muted, water-colour hues.
// Brushstrokes are large radial-gradient ellipses at very low alpha,
// so hundreds of overlapping daubs build up tonal depth over time.
// Morandi palette — very low saturation, warm-biased dusty tones.
// Stone / sandy buff / dusty rose / muted sage, never pure cool.
// Morandi warm palette — R > G > B on every entry, never cool or ghostly.
// dreamPond=stone/linen  coralCurrent=dusty rose/blush  auroraBloom=warm buff/khaki
var MONET_PALS={
  dreamPond:    [[167,205,195],[201,226,219],[132,184,200],[205,230,237],[197,189,219],[233,229,242],[198,217,223],[232,240,238]],
  coralCurrent: [[203,154,164],[236,221,226],[223,121,69],[248,230,214],[186,127,138],[247,238,241],[235,181,137],[250,242,236]],
  auroraBloom:  [[233,197,69],[250,242,200],[151,125,186],[233,229,242],[130,177,164],[232,244,240],[240,207,180],[249,235,220]]
};

function monetBlob(eco,vol,cent){
  var pal=MONET_PALS[eco]||MONET_PALS.dreamPond;
  var t=clamp(cent,0,1)*(pal.length-1),i=t|0,f=t-i;
  var a=pal[i],b=pal[Math.min(i+1,pal.length-1)];
  var c=[a[0]+(b[0]-a[0])*f|0,a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0];

  var x=R(W*0.04,W*0.96),y=R(H*0.04,H*0.96);
  var baseR=38+vol*110+R(0,55);
  var alpha=0.024+vol*0.03; // quiet background, kept below Kandinsky
  // Horizontal brush strokes ~45% of the time, circular blobs otherwise
  var horiz=Math.random()<0.45;

  MX.save();
  MX.translate(x,y);
  MX.rotate(horiz?R(-0.18,0.18):R(0,Math.PI*2));
  MX.scale(1,horiz?R(0.22,0.48):R(0.55,1.15));
  var g=MX.createRadialGradient(0,0,0,0,0,baseR);
  g.addColorStop(0,  col3(c,alpha));
  g.addColorStop(0.5,col3(c,alpha*0.5));
  g.addColorStop(1,  col3(c,0));
  MX.fillStyle=g;
  MX.beginPath();MX.arc(0,0,baseR,0,Math.PI*2);MX.fill();
  MX.restore();
}

function monetGouacheWash(eco,vol,cent,flux){
  var pal=MONET_PALS[eco]||MONET_PALS.dreamPond;
  var t=clamp(cent+flux*.18,0,1)*(pal.length-1),i=t|0,f=t-i;
  var a=pal[i],b=pal[Math.min(i+1,pal.length-1)];
  var c=[a[0]+(b[0]-a[0])*f|0,a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0];
  var y=lerp(H*.78,H*.22,cent)+R(-H*.08,H*.08);
  var x=R(W*.18,W*.82);
  var w=R(W*.42,W*.86)*(0.75+vol*.45);
  var h=R(34,86)+vol*70;
  var rot=R(-.08,.08)+(cent-.5)*.08;
  MX.save();
  MX.translate(x,y);MX.rotate(rot);
  MX.globalCompositeOperation='source-over';
  for(var layer=0;layer<3;layer++){
    var yy=(layer-1)*h*.16+R(-4,4);
    var alpha=(.03+vol*.038)*(1-layer*.2);
    var g=MX.createLinearGradient(-w*.5,yy,w*.5,yy+h*.12);
    g.addColorStop(0,col3(c,0));
    g.addColorStop(.16,col3(c,alpha*.65));
    g.addColorStop(.5,col3(c,alpha));
    g.addColorStop(.84,col3(c,alpha*.55));
    g.addColorStop(1,col3(c,0));
    MX.fillStyle=g;
    MX.beginPath();
    MX.ellipse(0,yy,w*.5,h*.5*(1+layer*.12),0,0,Math.PI*2);
    MX.fill();
  }
  MX.restore();
}

// Large atmospheric wash at session start
function monetAtmo(eco){
  var pal=MONET_PALS[eco]||MONET_PALS.dreamPond;
  var c=pal[Math.random()*pal.length|0];
  var x=R(W*0.1,W*0.9),y=R(H*0.1,H*0.9);
  var r=R(H*0.25,H*0.55);
  var g=MX.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col3(c,0.075));
  g.addColorStop(1,col3(c,0));
  MX.fillStyle=g;MX.beginPath();MX.arc(x,y,r,0,Math.PI*2);MX.fill();
}

function monetRipple(eco,vol,cent,flux){
  var pal=MONET_PALS[eco]||MONET_PALS.dreamPond;
  var t=clamp(cent+R(-.12,.12),0,1)*(pal.length-1),i=t|0,f=t-i;
  var a=pal[i],b=pal[Math.min(i+1,pal.length-1)];
  var c=[a[0]+(b[0]-a[0])*f|0,a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0];
  var x=R(W*.06,W*.94),y=R(H*.08,H*.92);
  var rx=34+vol*120+R(0,70),ry=rx*R(.18,.42);
  var rings=2+Math.floor(flux*4);
  MX.save();
  MX.translate(x,y);
  MX.rotate(R(-.32,.32)+(cent-.5)*.18);
  MX.globalCompositeOperation='source-over';
  for(var n=0;n<rings;n++){
    var k=1+n*.38;
    var rg=MX.createRadialGradient(0,0,0,0,0,rx*k);
    rg.addColorStop(0,col3(c,(.014+vol*.018)*(1-n*.18)));
    rg.addColorStop(.64,col3(c,(.01+vol*.012)*(1-n*.18)));
    rg.addColorStop(1,col3(c,0));
    MX.fillStyle=rg;
    MX.beginPath();
    MX.ellipse(0,0,rx*k,ry*k,0,0,Math.PI*2);
    MX.fill();
  }
  var g=MX.createRadialGradient(0,0,0,0,0,rx*1.1);
  g.addColorStop(0,col3(c,.02+vol*.022));
  g.addColorStop(1,col3(c,0));
  MX.fillStyle=g;MX.beginPath();MX.ellipse(0,0,rx*1.15,ry*1.35,0,0,Math.PI*2);MX.fill();
  MX.restore();
}

// ══════════════════════════════════════════════════════════
// LAYER 2 — KANDINSKY (geometric onsets, drawn live on X)
// Shapes reference four Kandinsky works:
//   Composition 8  → bold line, filled/hollow circle, small checker
//   Transverse Line → diagonal colour band
//   Delicate Tension→ thin arc, hollow triangle
//   Circles in a Circle → ring system with inner dots
// ══════════════════════════════════════════════════════════
// ── Kandinsky palette — recognisably coloured but never garish primaries ──
var KR=[181,73,47],  KY=[193,135,43],  KB=[66,107,128];
var KO=[207,87,50],  KV=[130,104,164], KG=[79,129,117], KBK=[37,36,35];
var KP=[170,102,114], KCY=[105,160,181], KCR=[197,189,170];
var K_ALL=[KR,KY,KB,KO,KV,KG,KP,KCY,KCR];

// ══════════════════════════════════════════════════════════
// LAYER 2 — KANDINSKY  27 single-element forms, one per onset.
// Sources: Yellow-Red-Blue 1925 (YRB), Composition 8 1923 (C8),
//          Delicate Tension 1923 (DT), Circles in a Circle 1923 (CiC),
//          Transverse Line 1923 (TL), later Bauhaus works (BH).
// Each spawned shape grows from 0.2× into full size, then bakes to KC.
// ══════════════════════════════════════════════════════════

// ── 27 painting-specific elements — one per onset, grow from 0.18× to full ──
// Sources: YRB=Yellow-Red-Blue 1925, C8=Composition 8 1923,
//          DT=Delicate Tension 1923, CiC=Circles in a Circle 1923,
//          TL=Transverse Line 1923, BH=Later Bauhaus works
var KFORMS=[
  // ─── YRB: Yellow-Red-Blue 1925 ──────────────────────────────────────────
  function(ctx,x,y,s,rot,c){ // YRB-0 tall quadrilateral (dominant yellow mass)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(-s*.28,-s);ctx.lineTo(s*.32,-s*.92);
    ctx.lineTo(s*.38,s*.95);ctx.lineTo(-s*.35,s);
    ctx.closePath();ctx.fillStyle=col3(c,.8);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // YRB-1 target circles (dark outer, colour ring, white centre)
    ctx.save();ctx.translate(x,y);
    ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);
    ctx.fillStyle=col3(KBK,.84);ctx.fill();
    ctx.beginPath();ctx.arc(0,0,s*.66,0,Math.PI*2);
    ctx.strokeStyle=col3(c,.88);ctx.lineWidth=s*.17;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,s*.24,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.82)';ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // YRB-2 long lance / spike (the red diagonal thrust)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(s*2,0);ctx.lineTo(-s*.5,s*.13);ctx.lineTo(-s*.5,-s*.13);
    ctx.closePath();ctx.fillStyle=col3(c,.82);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // YRB-3 parallel line bundle (hatching strips)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    var n=5,gap=s*.22,len=s*1.45;
    ctx.strokeStyle=col3(c,.76);ctx.lineCap='round';
    for(var i=0;i<n;i++){
      var yy=(i-(n-1)*.5)*gap;
      ctx.lineWidth=Math.max(s*(.054-i*.009),s*.015);
      ctx.beginPath();ctx.moveTo(-len*.5,yy);ctx.lineTo(len*.5,yy);ctx.stroke();
    }ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // YRB-4 bold sweep arc (large black curve)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();ctx.arc(0,s*.55,s*1.2,-Math.PI*.75,Math.PI*.05);
    ctx.strokeStyle=col3(KBK,.86);ctx.lineWidth=s*.12;ctx.lineCap='round';ctx.stroke();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // YRB-5 small floating rectangle accent
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.fillStyle=col3(c,.8);ctx.fillRect(-s*.4,-s*.24,s*.8,s*.48);ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // YRB-6 two thin crossing diagonals
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.strokeStyle=col3(c,.68);ctx.lineWidth=s*.024;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-s,s*.38);ctx.lineTo(s,-s*.38);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-s*.6,-s*.5);ctx.lineTo(s*.6,s*.5);ctx.stroke();ctx.restore();
  },
  // ─── C8: Composition 8, 1923 ─────────────────────────────────────────────
  function(ctx,x,y,s,rot,c){ // C8-0 large quarter-circle arc (top-left arc mass)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.arc(0,0,s,0,Math.PI*.5);
    ctx.arc(0,0,s*.52,Math.PI*.5,0,true);
    ctx.closePath();ctx.fillStyle=col3(c,.8);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // C8-1 checkerboard 2x2
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    var q=s*.44;
    ctx.fillStyle=col3(c,.8);ctx.fillRect(-q,-q,q,q);ctx.fillRect(0,0,q,q);
    ctx.fillStyle=col3(KBK,.76);ctx.fillRect(0,-q,q,q);ctx.fillRect(-q,0,q,q);ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // C8-2 checkerboard 3x3
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    var q=s*.3;
    for(var row=0;row<3;row++) for(var cl=0;cl<3;cl++){
      ctx.fillStyle=(row+cl)%2===0?col3(c,.78):col3(KBK,.72);
      ctx.fillRect(-q*1.5+cl*q,-q*1.5+row*q,q,q);
    }ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // C8-3 fan of radiating lines
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    var n=7,spread=Math.PI*.8,a0=-spread*.5;
    for(var i=0;i<n;i++){
      var a=a0+(i/(n-1))*spread;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);
      ctx.strokeStyle=col3(c,.74);
      ctx.lineWidth=Math.max(s*(.056-.005*i),s*.014);
      ctx.lineCap='round';ctx.stroke();
    }ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // C8-4 hollow triangle outline
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0,-s*.72);ctx.lineTo(s*.62,s*.36);ctx.lineTo(-s*.62,s*.36);
    ctx.closePath();
    ctx.strokeStyle=col3(c,.8);ctx.lineWidth=s*.048;ctx.lineJoin='miter';ctx.stroke();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // C8-5 filled solid triangle
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0,-s*.72);ctx.lineTo(s*.62,s*.36);ctx.lineTo(-s*.62,s*.36);
    ctx.closePath();ctx.fillStyle=col3(c,.8);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // C8-6 solid semicircle / hemisphere
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();ctx.arc(0,0,s,0,Math.PI);ctx.closePath();
    ctx.fillStyle=col3(c,.8);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // C8-7 diagonal filled parallelogram
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    var w=s*1.3,h=s*.55,sk=h*.34;
    ctx.beginPath();
    ctx.moveTo(-w*.5-sk,-h*.5);ctx.lineTo(w*.5-sk,-h*.5);
    ctx.lineTo(w*.5+sk,h*.5);ctx.lineTo(-w*.5+sk,h*.5);
    ctx.closePath();ctx.fillStyle=col3(c,.78);ctx.fill();ctx.restore();
  },
  // ─── DT: Delicate Tension, 1923 ──────────────────────────────────────────
  function(ctx,x,y,s,rot,c){ // DT-0 vesica spindle lens
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    var bx=s*.62;
    ctx.beginPath();
    ctx.moveTo(0,-s);
    ctx.bezierCurveTo(bx,-s*.38,bx,s*.38,0,s);
    ctx.bezierCurveTo(-bx,s*.38,-bx,-s*.38,0,-s);
    ctx.fillStyle=col3(c,.8);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // DT-1 tension bracket pair (two opposing arcs)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    var off=s*.48,r=s*.65;
    ctx.strokeStyle=col3(c,.78);ctx.lineWidth=s*.048;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(-off,0,r,Math.PI*.3,Math.PI*1.7);ctx.stroke();
    ctx.beginPath();ctx.arc(off,0,r,-Math.PI*.7,Math.PI*.7);ctx.stroke();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // DT-2 fine single arc (delicate curve)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();ctx.arc(0,0,s,Math.PI*.1,Math.PI*.9);
    ctx.strokeStyle=col3(c,.74);ctx.lineWidth=s*.032;ctx.lineCap='round';ctx.stroke();ctx.restore();
  },
  // ─── CiC: Circles in a Circle, 1923 ─────────────────────────────────────
  function(ctx,x,y,s,rot,c){ // CiC-0 circles-in-circle ring system (painting-faithful positions)
    ctx.save();ctx.translate(x,y);
    ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);
    ctx.strokeStyle=col3(KBK,.7);ctx.lineWidth=s*.05;ctx.stroke();
    var pts=[[.44,-.18,.22,0],[-.28,.40,.17,1],[.12,-.52,.15,2],[-.46,-.26,.12,4],[.32,.44,.11,3],[-.12,.22,.09,5]];
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      ctx.beginPath();ctx.arc(p[0]*s,p[1]*s,p[2]*s,0,Math.PI*2);
      ctx.fillStyle=col3(K_ALL[p[3]],.76);ctx.fill();
    }ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // CiC-1 several overlapping circles (Several Circles 1926)
    ctx.save();ctx.translate(x,y);
    var offs=[[0,0,.52,0],[s*.5,-s*.3,.38,1],[-s*.42,s*.28,.3,2],[s*.25,s*.4,.25,3]];
    for(var i=0;i<offs.length;i++){
      var o=offs[i];
      ctx.beginPath();ctx.arc(o[0],o[1],s*o[2],0,Math.PI*2);
      ctx.fillStyle=col3(K_ALL[o[3]],.6);ctx.fill();
    }ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // CiC-2 thick hollow ring
    ctx.save();ctx.translate(x,y);
    ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);
    ctx.strokeStyle=col3(c,.78);ctx.lineWidth=s*.2;ctx.stroke();ctx.restore();
  },
  // ─── TL: Transverse Line, 1923 ───────────────────────────────────────────
  function(ctx,x,y,s,rot,c){ // TL-0 diagonal wedge / colour band
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(-s*1.1,-s*.38);ctx.lineTo(s*1.1,-s*.12);
    ctx.lineTo(s*1.1,s*.38);ctx.lineTo(-s*1.1,s*.12);
    ctx.closePath();ctx.fillStyle=col3(c,.74);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // TL-1 angled hatch lines at ~45deg
    ctx.save();ctx.translate(x,y);ctx.rotate(rot+Math.PI*.25);
    var n=6,gap=s*.2,len=s*1.3;
    ctx.strokeStyle=col3(c,.68);ctx.lineCap='round';
    for(var i=0;i<n;i++){
      var yy=(i-(n-1)*.5)*gap;
      ctx.lineWidth=Math.max(s*(.036-i*.005),s*.012);
      ctx.beginPath();ctx.moveTo(-len*.5,yy);ctx.lineTo(len*.5,yy);ctx.stroke();
    }ctx.restore();
  },
  // ─── BH: Later Bauhaus / Composition X ───────────────────────────────────
  function(ctx,x,y,s,rot,c){ // BH-0 biomorphic blob (Comp X organic form)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(s*.6,0);
    ctx.bezierCurveTo(s*.6,-s*.9,-s*.5,-s*.85,-s*.65,-s*.2);
    ctx.bezierCurveTo(-s*.8,s*.4,-s*.2,s*.8,s*.3,s*.6);
    ctx.bezierCurveTo(s*.7,s*.4,s*.6,s*.4,s*.6,0);
    ctx.closePath();ctx.fillStyle=col3(c,.74);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // BH-1 crescent / half-ring
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    ctx.arc(0,0,s,Math.PI*.15,Math.PI*1.85);
    ctx.arc(0,s*.28,s*.7,Math.PI*1.85,Math.PI*.15,true);
    ctx.closePath();ctx.fillStyle=col3(c,.78);ctx.fill();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // BH-2 zigzag / staircase form
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();ctx.moveTo(-s*.65,s*.3);
    ctx.lineTo(-s*.65,-s*.3);ctx.lineTo(-s*.15,-s*.3);ctx.lineTo(-s*.15,s*.3);
    ctx.lineTo(s*.15,s*.3);ctx.lineTo(s*.15,-s*.3);ctx.lineTo(s*.65,-s*.3);
    ctx.strokeStyle=col3(c,.74);ctx.lineWidth=s*.044;ctx.lineJoin='miter';ctx.lineCap='square';ctx.stroke();ctx.restore();
  },
  function(ctx,x,y,s,rot,c){ // BH-3 open spiral coil
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();
    var turns=2.5,steps=72;
    for(var i=0;i<=steps;i++){
      var a=(i/steps)*turns*Math.PI*2,r2=(i/steps)*s;
      var px2=Math.cos(a)*r2,py2=Math.sin(a)*r2;
      i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
    }
    ctx.strokeStyle=col3(c,.7);ctx.lineWidth=s*.034;ctx.lineCap='round';ctx.stroke();ctx.restore();
  }
];
var KN=KFORMS.length; // 27

// Bag-draw ensures all 27 forms appear before any repeats
var kBag=[],kGrowing=[];
function kRefill(){
  kBag=[];for(var i=0;i<KN;i++)kBag.push(i);
  for(var j=kBag.length-1;j>0;j--){var r=Math.random()*(j+1)|0;var tmp=kBag[j];kBag[j]=kBag[r];kBag[r]=tmp;}
}
function kPick(){if(!kBag.length)kRefill();return kBag.pop();}

var K_GROUPS={
  calm:[7,8,17,18,19,24,25,26],
  warm:[0,1,2,3,4,5,10,11,12,13],
  bright:[0,4,6,12,14,20,21,22,23],
  rough:[3,5,6,15,16,20,21,22,23]
};
function pickByTone(){
  var group=K_GROUPS.calm;
  if(emoFlux>0.52||emoRate>0.55)group=K_GROUPS.rough;
  else if(emoCent>0.62)group=K_GROUPS.bright;
  else if(emoVol>0.45)group=K_GROUPS.warm;
  var seed=Math.floor((emoCent*17+emoFlux*23+emoRate*19+emoHarm*11+kPhraseId*5))%group.length;
  return group[seed];
}

function spawnK(str,isSentence){
  var t=(pickByTone()+kPick())%KN;
  var x=R(W*.1,W*.9),y=R(H*.1,H*.9);
  var s=R(16,32)+(str||0)*20+emoVol*18+emoRate*6+(isSentence?8:0);
  var rot=R(-0.45,0.45)+(emoCent-.5)*1.15+emoFlux*.7;
  var ci=0;
  if(currentEco==='dreamPond')ci=Math.floor(5+emoCent*2+emoHarm*2)%K_ALL.length;
  else if(currentEco==='coralCurrent')ci=[0,3,6,8][Math.floor((emoVol+emoCent+emoRate)*3)%4];
  else ci=[1,4,5,7][Math.floor((emoFlux+emoRate+emoCent)*3)%4];
  var c=K_ALL[ci];
  kGrowing.push({fn:KFORMS[t],x:x,y:y,s:s,rot:rot,c:c,p:.06,v:clamp(emoVol+emoFlux*.25,0,1)});
  kPhraseId++;
  if(kGrowing.length>6)finalizeK(kGrowing.shift());
  hasPainted=true;
}
function finalizeK(g){
  KX.save();KX.globalAlpha=.84;
  g.fn(KX,g.x,g.y,g.s,g.rot,g.c);
  KX.restore();
}
function updateKGrowth(){
  for(var i=kGrowing.length-1;i>=0;i--){
    var g=kGrowing[i];
    g.v=lerp(g.v,clamp(emoVol+emoFlux*.55+emoRate*.2+onsetStr*.2,0,1),.18);
    g.p+=0.007+g.v*0.02+(voiceNow?0.008:0.003);
    if(g.p>=1){finalizeK(g);kGrowing.splice(i,1);}
  }
}
function drawGrowingK(ctx){
  for(var i=0;i<kGrowing.length;i++){
    var g=kGrowing[i];
    var sc=0.18+0.82*g.p; // grow from 0.18x to full
    ctx.save();
    ctx.globalAlpha=g.p*0.84;
    ctx.translate(g.x,g.y);ctx.scale(sc,sc);ctx.translate(-g.x,-g.y);
    g.fn(ctx,g.x,g.y,g.s,g.rot,g.c);
    ctx.restore();
  }
}

// ── STATS ─────────────────────────────────────────────────
function showStats(){
  var el=$('stats'),vC=voiceNow?'vy':'';
  el.innerHTML=
    '<span class="l">se</span> <span>'+specE.toFixed(1)+'</span> '+
    '<span class="l">gate</span> <span>'+nGate.toFixed(1)+'</span><br>'+
    '<span class="l">vs</span> <span>'+lastVoiceScore.toFixed(2)+'</span> '+
    '<span class="l">eco</span> <span class="'+vC+'">'+(voiceNow?currentEco:'off')+'</span>';
}

// ── RENDER LOOP ────────────────────────────────────────────
function loop(){
  if(!on)return;
  rafId=requestAnimationFrame(loop);
  fc++;
  showStats();
  if(calib)return;

  // Monet: voice-synced gouache washes, only while actual voice is present.
  if(voiceNow&&sVol>0.025){
    if(fc%5===0)monetGouacheWash(currentEco,sVol,sCent,sFlux);
    if(fc%16===0)monetBlob(currentEco,sVol*.7,sCent);
    if(onsetFired&&fc%3===0)monetRipple(currentEco,sVol*.55,sCent,sFlux);
  }

  // Kandinsky: small elements start growing with the voice, with a short limiter.
  var nowK=performance.now();
  var phraseAge=speechStart?nowK-speechStart:0;
  if(speaking&&phraseAge>2200&&nowK-kLastSpawnMs>360){
    speechStart=nowK;
    kSpeechSpawns=0;
    kPhraseN=0;
  }
  var cadence=430-clamp(sRate,0,5)*34-sFlux*70;
  var activeVoice=voiceNow&&(sVol>0.018||lastVoiceScore>0.72);
  if(activeVoice&&phraseAge>12&&nowK-kLastSpawnMs>Math.max(170,cadence)){
    spawnK(onsetStr,false);
    kSpeechSpawns++;
    kLastSpawnMs=nowK;
  }
  if(!speaking&&lastSpeakEnd&&nowK-lastSpeakEnd<160&&kPhraseN>1&&kSpeechSpawns===0&&kPhraseEnergy>0.05){
    spawnK(0.1,true);
    kSpeechSpawns++;
    kLastSpawnMs=nowK;
  }
  updateKGrowth();

  // Monet very slow fade (~6 min half-life at 60fps)
  MX.fillStyle='rgba(248,246,241,0.0005)';MX.fillRect(0,0,W,H);

  // Composite: bg → Monet layer → persistent Kandinsky layer
  X.fillStyle='#F8F6F1';X.fillRect(0,0,W,H);
  X.save();X.setTransform(1,0,0,1,0,0);X.drawImage(MC,0,0);X.restore();
  X.save();X.setTransform(1,0,0,1,0,0);X.drawImage(KC,0,0);X.restore();
  drawGrowingK(X);
}

// ── CONTROLS ──────────────────────────────────────────────
async function startMic(){
  if(on)return;
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    MS=stream;
    AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')await AC.resume();
    var src=AC.createMediaStreamSource(MS);
    AN=AC.createAnalyser();AN.fftSize=2048;AN.smoothingTimeConstant=0.3;
    src.connect(AN);
    FD=new Uint8Array(AN.frequencyBinCount);TD=new Uint8Array(AN.frequencyBinCount);
    prevSpec=null;speaking=false;voiceNow=false;voiceFrames=0;quietFrames=0;
    speechStart=0;kLastSpawnMs=0;kSpeechSpawns=0;kPhraseN=0;
    calib=true;calN=0;calArr=[];calRmsArr=[];nFloor=0;nGate=0;rFloor=0;rGate=0;
    audioOK=true;on=true;
    $('btnMic').classList.add('on');
    $('overlay').classList.remove('hidden');
    $('overlay').querySelector('.overlay-t').textContent='Listening...';
    $('overlay').querySelector('.overlay-s').textContent='Calibrating...';
    // Seed Monet canvas with a few atmospheric washes
    for(var i=0;i<14;i++)monetAtmo(i%3===0?'auroraBloom':'dreamPond');
    if(audioTimer)clearInterval(audioTimer);
    audioTimer=setInterval(readAudio,50);
    loop();
    toast('Mic OK');
  }catch(e){toast('Mic error: '+e.message);console.error(e);}
}

function stopMic(){
  on=false;audioOK=false;$('btnMic').classList.remove('on');
  if(audioTimer){clearInterval(audioTimer);audioTimer=null;}
  if(MS){MS.getTracks().forEach(function(t){t.stop()});MS=null;}
  if(AC){AC.close();AC=null;}
  if(rafId)cancelAnimationFrame(rafId);
  speaking=false;voiceNow=false;voiceFrames=0;quietFrames=0;prevSpec=null;
  $('overlay').classList.remove('hidden');
  $('overlay').querySelector('.overlay-t').textContent='Tap Canvas to Start';
  $('overlay').querySelector('.overlay-s').textContent='Speak to paint your mood';
}

function save(){
  if(!hasPainted){toast('Paint something first');return;}
  // Flatten current composition to export canvas
  var d2=Math.min(window.devicePixelRatio||1,2);
  var ec=document.createElement('canvas');ec.width=W*d2;ec.height=H*d2;
  var e=ec.getContext('2d');e.setTransform(d2,0,0,d2,0,0);
  e.fillStyle='#F8F6F1';e.fillRect(0,0,W,H);
  e.save();e.setTransform(1,0,0,1,0,0);e.drawImage(MC,0,0);e.restore();
  e.save();e.setTransform(1,0,0,1,0,0);e.drawImage(KC,0,0);e.restore();
  drawGrowingK(e);
  var a=document.createElement('a');
  a.download='echo-canvas-'+Date.now()+'.png';
  a.href=ec.toDataURL('image/png');a.click();
  toast('Saved');
}

function reset(){
  kBag=[];kGrowing=[];kCD=0;kPhraseId=0;kLastSpawnMs=0;kSpeechSpawns=0;voiceNow=false;voiceFrames=0;quietFrames=0;
  MX.fillStyle='#F8F6F1';MX.fillRect(0,0,W,H);
  KX.clearRect(0,0,W,H);
  X.fillStyle='#F8F6F1';X.fillRect(0,0,W,H);
  hasPainted=false;
  toast('Cleared');
}

$('btnMic').onclick=function(e){e.stopPropagation();on?stopMic():startMic();};
$('btnSaveLg').onclick=save;
$('btnResetLg').onclick=reset;
C.addEventListener('click',function(){if(!on)startMic();});

})();
</script>
</body>
