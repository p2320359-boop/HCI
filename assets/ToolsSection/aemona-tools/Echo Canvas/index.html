<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Echo Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<link rel="stylesheet" href="./css/main.css">
<link rel="stylesheet" href="./css/ui.css">
<link rel="stylesheet" href="./css/animation.css">
<link rel="stylesheet" href="../aemona-embedded.css?v=20260611-2">
<style>
  .back-home {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 100;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #6C4F88;
    background: rgba(255, 255, 255, .78);
    box-shadow: 0 14px 30px rgba(108, 79, 136, .13);
    text-decoration: none;
    backdrop-filter: blur(10px);
  }

  .back-home svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>

<body class="tool-echo">

<a class="back-home" href="../index.html" aria-label="Back to tools">
  <svg viewBox="0 0 24 24">
    <path d="m15 18-6-6 6-6"></path>
  </svg>
</a>

<div id="app">

  <!-- Header -->
  <header>
    <div class="echo-heading">
      <div class="logo">
        <span class="logo-dot"></span>
        Echo Canvas
      </div>
      <div class="echo-subtitle">Let sound become color and movement.</div>
    </div>
  </header>

  <!-- Canvas area -->
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <canvas id="g" class="grain"></canvas>
    <div class="stats" id="stats"></div>

    <!-- Calibration / hint overlay (hidden until mic starts) -->
    <div class="overlay hidden" id="overlay">
      <div class="overlay-t">Listening…</div>
      <div class="overlay-s">Calibrating silence</div>
      <div class="calib-prog"><div class="calib-fill"></div></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="side-btn" id="btnSaveLg" title="Save artwork">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="mic-btn" id="btnMic" title="Toggle microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
        <path d="M19 10v2a7 7 0 01-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="side-btn" id="btnResetLg" title="Clear canvas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 105.64-11.36L1 10"/>
      </svg>
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="privacy">Your voice stays on this device.</div>
  </div>

</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Script loading order: state → utils → color → shapes → brushes → audio → painter → ui → app -->
<script src="./js/state.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/color.js"></script>
<script src="./shapes/particle.js"></script>
<script src="./shapes/blob.js"></script>
<script src="./shapes/bloom.js"></script>
<script src="./shapes/ribbon.js"></script>
<script src="./js/brushes.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/painter.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
