<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Inner Hear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f7f4ef;
      color: #6C4F88;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .back-home {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #6C4F88;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 14px 30px rgba(108, 79, 136, .13);
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    .back-home svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .inner-hear {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .74), transparent 44%),
        #f7f4ef;
    }

    .noise-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .92;
      filter: saturate(.82) contrast(.95);
    }

    .intro-copy {
      position: fixed;
      left: 50%;
      bottom: clamp(42px, 8vh, 78px);
      z-index: 10;
      width: min(78vw, 420px);
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 14px rgba(255, 255, 255, .78);
      transition: opacity .6s ease, transform .6s ease;
    }

    .intro-copy.is-softened {
      opacity: .22;
      transform: translateX(-50%) translateY(10px);
    }

    .intro-copy h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 8vw, 54px);
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0;
    }

    .intro-copy p {
      margin-top: 14px;
      color: rgba(108, 79, 136, .66);
      font-size: clamp(13px, 3.4vw, 16px);
      line-height: 1.6;
      font-weight: 300;
    }

    .listen-button {
      position: fixed;
      left: 50%;
      bottom: clamp(158px, 24vh, 220px);
      z-index: 15;
      transform: translateX(-50%);
      min-width: 132px;
      height: 46px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      color: #6C4F88;
      font-size: 13px;
      font-weight: 500;
      box-shadow:
        0 18px 42px rgba(108, 79, 136, .16),
        inset 0 1px 0 rgba(255, 255, 255, .85);
      backdrop-filter: blur(12px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
    }

    .listen-button.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .listen-button:active {
      transform: translateX(-50%) scale(.97);
    }
  </style>
  <link rel="stylesheet" href="../aemona-embedded.css?v=20260611-2">
</head>

<body class="tool-inner-hear">
  <a class="back-home" href="../index.html" aria-label="Back to tools">
    <svg viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6"></path>
    </svg>
  </a>

  <main class="inner-hear">
    <video
      class="noise-video"
      src="./white%20noise%20with%20touch%20design.mp4"
      playsinline
      loop
      preload="auto"
    ></video>

    <section class="intro-copy" aria-label="Inner Hear guidance">
      <h1>Inner Hear</h1>
      <p>Let the noise sit beside you. Watch the surface until your attention finds a slower rhythm.</p>
    </section>

    <button class="listen-button" type="button">Tap to listen</button>
  </main>

  <script>
    const video = document.querySelector('.noise-video');
    const button = document.querySelector('.listen-button');
    const copy = document.querySelector('.intro-copy');

    function softenCopy() {
      copy.classList.add('is-softened');
    }

    async function startSound() {
      try {
        video.muted = false;
        video.volume = 0.64;
        await video.play();
        button.classList.remove('is-visible');
        softenCopy();
      } catch (error) {
        button.classList.add('is-visible');
      }
    }

    button.addEventListener('click', startSound);
    window.addEventListener('pointerdown', startSound, { once: true });
    window.addEventListener('keydown', startSound, { once: true });

    startSound();
  </script>
</body>

</html>
